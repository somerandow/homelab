---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: a
  namespace: default
spec:
  interval: 10m
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: homelab
  path: "app/components"
  patches:
    - patch: |-
        - op: replace
          path: /spec/path
          value: /apps/a/homelab
  prune: true
  timeout: 1m