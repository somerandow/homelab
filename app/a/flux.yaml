---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: a
  namespace: default
spec:
  interval: 10m
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: homelab
  #TODO: Think about this, should be nested or nah?
  path: "app/a/target/TARGET"
  prune: true
  timeout: 1m
