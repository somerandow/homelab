---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: arr
      version: '0.7.7'
      sourceRef:
        kind: OCIRepository
        name: somerandow-charts
        namespace: media
      interval: 5m
  releaseName: bazarr
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    serviceAccount:
      create: true
    service:
      port: 6767
    image:
      repository: ghcr.io/home-operations/bazarr
      tag: 1.6.2
    ingress:
      main:
        forwardAuth:
          allowedGroups:
            - Bazarr-Admins