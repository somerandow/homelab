---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flaresolverr
  annotations:
    app.homelab.wojoinc.xyz/target: base
spec:
  interval: 30m
  targetNamespace: media
  sourceRef:
    kind: GitRepository
    name: homelab
  path: "app/flaresolverr/base"
  prune: true
  timeout: 5m
