---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: arr
      version: "0.7.7"
      sourceRef:
        kind: HelmRepository
        name: somerandow-charts
        namespace: media
      interval: 5m
  releaseName: sonarr
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    serviceAccount:
      create: true
    service:
      port: 8989
    image:
      repository: ghcr.io/home-operations/sonarr
      tag: 5.0.0
    probes:
      livenessCmd:
        - /usr/bin/env
        - bash
        - -c
        - curl --fail localhost:8989/api/v3/system/status?apiKey=`IFS=\> && while read -d \< E C; do if [[ $E = "ApiKey" ]]; then echo $C; fi; done < /config/config.xml`
    ingress:
      main:
        forwardAuth:
          allowedGroups:
            - Sonarr-Admins
      api:
        forwardAuth:
          allowedGroups:
            - Sonarr-Admins
