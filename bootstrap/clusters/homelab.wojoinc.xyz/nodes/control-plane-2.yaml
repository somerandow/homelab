machine:
  certSANs:
    - 127.0.0.1
    - 10.0.0.12
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  wipe: true
  diskSelector:
    match: disk.model == "Samsung SSD 960 EVO 250GB"
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp0s25
up: true
addresses:
  - address: 10.0.0.12/24
routes:
  - gateway: 10.0.0.1
    metric: 1024
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  minSize: 10GB
  grow: true
encryption:
  provider: luks2
  keySize: 256
  # Key material loaded in from secret
  # Because the TPM on this node is garbage... thanks Intel...
---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  cipher: aes-xts-plain64
  keySize: 256
  keys:
    - nodeID: { }
      slot: 0
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: control-plane-2
