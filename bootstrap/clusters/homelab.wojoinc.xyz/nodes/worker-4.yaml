---
machine:
  # TODO: Check if this can be removed now
  certSANs:
    - 127.0.0.1
    - 10.0.0.9
    - 10.4.0.9
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  wipe: true
  diskSelector:
    match: disk.uuid == "36363530-54b0-5466-0025-384e00000003"
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: worker-4
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.uuid == "36363530-54b0-5466-0025-384e00000003"
  minSize: 50GB
  maxSize: 200GB
  grow: true
encryption:
  provider: luks2
  cipher: aes-xts-plain64
  keySize: 256
  keys:
    - tpm: { }
      slot: 0
---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  cipher: aes-xts-plain64
  keySize: 256
  keys:
    - tpm: { }
      slot: 0
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - enp2s0f0np0
  - enp2s0f1np1
bondMode: 802.3ad
miimon: 100
updelay: 200
downdelay: 200
xmitHashPolicy: layer2+3
lacpRate: fast
multicast: true
mtu: 9000
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.vlan103
addresses:
  - address: 10.0.0.9/24
routes:
  - gateway: 10.0.0.1
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.vlan104
addresses:
  - address: 10.4.0.9/16
routes:
  - destination: 10.4.0.0/16
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.vlan105
addresses:
  - address: 10.5.0.9/16
routes:
  - destination: 10.5.0.0/16
